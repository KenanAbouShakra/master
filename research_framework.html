<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Framework</title>

  <style>
    body {
      margin: 0;
      background: #f5f6f8;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 20px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #75a8ff;
      color: white;
      border: none;
      border-radius: 6px;
    }

    svg {
      max-width: 1400px;
      width: 100%;
      height: auto;
      background: #f5f6f8;
      display: block;
    }

    .title {
      font-size: 34px;
      font-weight: 700;
      fill: #132033;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      fill: #132033;
    }
    .label {
      font-size: 18px;
      font-weight: 700;
      fill: #132033;
    }
    .text {
      font-size: 16px;
      fill: #132033;
    }
    .small {
      font-size: 15px;
      fill: #132033;
    }
    .muted {
      stroke: #a1a8b3;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .panel {
      fill: #ffffff;
      stroke: #bfc6cf;
      stroke-width: 2;
    }
    .main-panel {
      fill: #ffffff;
      stroke: #707887;
      stroke-width: 3;
    }
    .workflow {
      fill: #e6eefc;
      stroke: #75a8ff;
      stroke-width: 2;
    }
    .cicd {
      fill: #f2e9fb;
      stroke: #cf9cff;
      stroke-width: 2;
    }
    .delivery {
      fill: #e4f5e8;
      stroke: #75da91;
      stroke-width: 2;
    }
    .quality {
      fill: #f9f0e1;
      stroke: #f2aa55;
      stroke-width: 2;
    }
    .pill {
      fill: #f4f6f8;
      stroke: none;
    }
    .rq1 {
      fill: #e6eefc;
      stroke: #75a8ff;
      stroke-width: 2;
    }
    .rq2 {
      fill: #e4f5e8;
      stroke: #75da91;
      stroke-width: 2;
    }
    .diamond {
      fill: #dfe6ff;
      stroke: #7b8cff;
      stroke-width: 3;
    }
  </style>

  <script>
    function downloadImage() {
      const svg = document.querySelector("svg");
      const style = document.querySelector("style").innerHTML;

      const svgData = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1680">
          <style>${style}</style>
          <rect width="1200" height="1680" fill="#f5f6f8"/>
          ${svg.innerHTML}
        </svg>
      `;

      const img = new Image();
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function () {
        const scale = 3;
        const canvas = document.createElement("canvas");
        canvas.width = 1200 * scale;
        canvas.height = 1680 * scale;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f5f6f8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const a = document.createElement("a");
        a.download = "research-framework.png";
        a.href = canvas.toDataURL("image/png");
        a.click();

        URL.revokeObjectURL(url);
      };

      img.src = url;
    }
  </script>
</head>

<body>
  <div class="wrap">
    <button onclick="downloadImage()">Download PNG</button>

    <svg viewBox="0 0 1200 1680" xmlns="http://www.w3.org/2000/svg">

      <rect x="130" y="900" rx="10" ry="10" width="940" height="210" class="panel"/>

      <rect x="150" y="975" rx="4" ry="4" width="410" height="48" class="panel"/>

      <path d="M485 1305 L565 1380 M565 1380 L554 1379 M565 1380 L564 1369" class="muted"/>

      <text x="600" y="1512" text-anchor="middle" class="text">Socio-technical</text>

    </svg>
  </div>
</body>
</html>
